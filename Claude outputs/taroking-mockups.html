<title>TaroKing Mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,600&display=swap">
<style>
/* ---------- chrome (the page around the mockup) ---------- */
:root{
	--c-bg:#f3f2ee; --c-fg:#1b1b18; --c-fg2:#6b6a63; --c-line:#dad9d1; --c-panel:#ffffff; --c-acc:#1b1b18; --c-acc-fg:#ffffff;
}
@media (prefers-color-scheme: dark){
	:root:not([data-theme="light"]){ --c-bg:#191917; --c-fg:#ecebe6; --c-fg2:#9c9b93; --c-line:#33332f; --c-panel:#222220; --c-acc:#ecebe6; --c-acc-fg:#191917; }
}
:root[data-theme="dark"]{ --c-bg:#191917; --c-fg:#ecebe6; --c-fg2:#9c9b93; --c-line:#33332f; --c-panel:#222220; --c-acc:#ecebe6; --c-acc-fg:#191917; }

body{ background:var(--c-bg); color:var(--c-fg); font-family:'IBM Plex Sans',system-ui,sans-serif; padding-inline:16px; padding-block:20px 48px; margin:0; }
.chrome{ max-width:1320px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
.chrome h1{ font-size:20px; font-weight:600; margin:0; letter-spacing:-0.01em; }
.chrome p.lead{ margin:4px 0 0; color:var(--c-fg2); font-size:14px; max-width:70ch; }
.controls{ display:flex; flex-wrap:wrap; gap:16px 28px; align-items:flex-end; }
.ctl{ display:flex; flex-direction:column; gap:6px; }
.ctl label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--c-fg2); }
.seg{ display:inline-flex; border:1px solid var(--c-line); border-radius:8px; overflow:hidden; background:var(--c-panel); }
.seg button{ border:0; background:transparent; color:var(--c-fg); font:inherit; font-size:13px; padding:7px 12px; cursor:pointer; }
.seg button+button{ border-left:1px solid var(--c-line); }
.seg button[aria-pressed="true"]{ background:var(--c-acc); color:var(--c-acc-fg); }
.seg button:focus-visible{ outline:2px solid var(--c-acc); outline-offset:-2px; }
.ctl.land-only, .ctl.desk-only{ display:none; } .ctl.land-only.show, .ctl.desk-only.show{ display:flex; }
.notes{ background:var(--c-panel); border:1px solid var(--c-line); border-radius:10px; padding:14px 16px; font-size:13.5px; line-height:1.5; display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:8px 24px; }
.notes b{ font-weight:600; }
.notes span{ color:var(--c-fg2); }
.stage{ display:flex; justify-content:center; align-items:flex-start; overflow:hidden; }
.scaler{ transform-origin:top center; }

/* ---------- frame + app tokens ---------- */
.frame, .frame *{ box-sizing:border-box; }
.frame{ position:relative; overflow:hidden; background:var(--bg); color:var(--fg); font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; line-height:1.4; --display:'Sora',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif; }
.frame[data-d="phone"]{ width:390px; height:844px; border-radius:44px; border:10px solid #111; box-shadow:0 30px 60px rgba(0,0,0,.35); }
.frame[data-d="land"]{ width:844px; height:390px; border-radius:44px; border:10px solid #111; box-shadow:0 30px 60px rgba(0,0,0,.35); }
.frame[data-d="desktop"]{ width:1280px; height:820px; border-radius:12px; border:1px solid var(--c-line); box-shadow:0 20px 50px rgba(0,0,0,.18); }

/* Nočna miza — three schemes */
.frame[data-s="dark"]{ --bg:#0e1113; --bg2:#15191d; --bg3:#1a1f23; --line:#1f2529; --line2:#2a3238; --fg:#eef2f4; --fg2:#8fa1ab; --acc:#e9c46a; --acc-fg:#1a1405; --good:#7dd3c0; --bad:#f28482; --felt:radial-gradient(ellipse at 50% 15%, #1b2a26 0%, #0e1113 62%); --felt-fg:#eef2f4; --felt-fg2:#8fa1ab; --seat:rgba(255,255,255,.05); --seat-on:rgba(233,196,106,.12); --back:repeating-linear-gradient(135deg,#2a3340 0 3px,#1b2229 3px 6px); --back-edge:#3b4855; --panel:rgba(14,17,19,.86); --panel-float:rgba(14,17,19,.62); --chip:#1a1f23; --chip-fg:#c9d1d9; --chip-strong:#e9c46a; --chip-strong-fg:#1a1405; --chip-bad:#3a1f22; --chip-bad-fg:#f28482; }
.frame[data-s="light"]{ --bg:#d9d4c7; --bg2:#e9e5da; --bg3:#cfc9b9; --line:#bdb6a4; --line2:#a89f8a; --fg:#1c1b18; --fg2:#5d594f; --acc:#9a6a15; --acc-fg:#fffaf0; --good:#1b6b41; --bad:#b3291f; --felt:radial-gradient(ellipse at 50% 15%, #2a6b50 0%, #1c4a37 70%); --felt-fg:#f3f6f2; --felt-fg2:#c5d6cb; --seat:rgba(0,0,0,.18); --seat-on:rgba(255,244,214,.18); --back:repeating-linear-gradient(135deg,#7d6a45 0 3px,#5d4e32 3px 6px); --back-edge:#e6d3a0; --panel:#e9e5da; --panel-float:rgba(233,229,218,.82); --chip:#cfc9b9; --chip-fg:#1c1b18; --chip-strong:#9a6a15; --chip-strong-fg:#fffaf0; --chip-bad:#e9c4bc; --chip-bad-fg:#8e2419; }
.frame[data-s="blue"]{ --bg:#0b3a4a; --bg2:#0f4759; --bg3:#12536a; --line:#1c6379; --line2:#2a7b94; --fg:#eaf7fb; --fg2:#a9cdd8; --acc:#ff7a59; --acc-fg:#1c0d08; --good:#c3f73a; --bad:#ffb4a2; --felt:radial-gradient(circle at 50% 30%, #146e86 0%, #0b3a4a 70%); --felt-fg:#ffffff; --felt-fg2:#bfe3ec; --seat:rgba(0,0,0,.22); --seat-on:rgba(255,209,102,.18); --back:repeating-linear-gradient(135deg,#1d6b83 0 4px,#12546a 4px 8px); --back-edge:#8fe3f5; --panel:rgba(7,42,54,.9); --panel-float:rgba(7,42,54,.66); --chip:rgba(255,255,255,.12); --chip-fg:#dff2f7; --chip-strong:#ffd166; --chip-strong-fg:#1c1405; --chip-bad:#ff7a59; --chip-bad-fg:#1c0d08; }

/* ---------- app layout ---------- */
.app{ position:absolute; inset:0; display:flex; flex-direction:column; }
.top{ display:flex; align-items:center; gap:20px; padding:0 24px; height:56px; flex-shrink:0; border-bottom:1px solid var(--line); background:var(--bg); }
.frame[data-d="phone"] .top{ height:52px; padding:0 16px; gap:10px; }
.frame[data-d="land"] .top{ height:40px; padding:0 16px; gap:10px; }
.brand{ font-family:var(--display); font-weight:800; font-size:20px; letter-spacing:.02em; color:var(--acc); text-decoration:none; }
.frame[data-d="land"] .brand{ font-size:16px; }
.top nav{ display:flex; gap:2px; }
.frame[data-d="phone"] .top nav, .frame[data-d="land"] .top nav{ display:none; }
.top nav a{ text-decoration:none; color:var(--fg2); font-weight:500; font-size:14px; padding:7px 11px; border-radius:8px; cursor:pointer; }
.top nav a.on{ color:var(--acc); font-weight:700; background:var(--bg3); }
.top .sp{ flex:1; }
.top .me{ display:inline-flex; align-items:center; gap:8px; font-size:13px; color:var(--fg2); }
.top .me b{ color:var(--fg); font-weight:600; }
.top .me svg{ width:18px; height:18px; }
.top .pbtn{ display:none; gap:6px; }
.frame[data-d="phone"] .top .pbtn, .frame[data-d="land"] .top .pbtn{ display:inline-flex; }
.pbtn button{ border:1px solid var(--line2); background:var(--bg3); color:var(--fg); border-radius:8px; padding:4px 9px; font:inherit; font-size:12px; cursor:pointer; }
.pbtn button[aria-pressed="true"]{ background:var(--acc); color:var(--acc-fg); border-color:transparent; }

.miza{ flex:1; min-height:0; display:grid; grid-template-columns:auto minmax(0,1fr) auto; grid-template-areas:'info centre side'; gap:0; position:relative; background:var(--felt); }
.frame[data-d="desktop"] .miza[data-l="float"]{ grid-template-columns:minmax(0,1fr); grid-template-areas:'centre'; }
.frame[data-d="desktop"] .miza[data-l="float"] .side{ position:absolute; top:0; right:0; width:320px; z-index:2; pointer-events:none; }
.frame[data-d="desktop"] .miza[data-l="float"] .side .panel{ pointer-events:auto; background:var(--panel-float); }
.frame[data-d="desktop"] .miza[data-l="float"] .info.chips{ position:absolute; top:0; left:0; z-index:2; }
.frame[data-d="desktop"] .miza[data-l="float"] .info.chips .chip{ box-shadow:0 4px 14px rgba(0,0,0,.35); }
.frame[data-d="phone"] .miza{ display:flex; flex-direction:column; overflow-y:auto; }
.frame[data-d="land"] .miza{ grid-template-columns:auto minmax(0,1fr) auto; }

/* info column */
.info{ grid-area:info; display:flex; flex-direction:column; gap:8px; padding:16px 0 16px 24px; width:196px; align-items:flex-start; }
.info[hidden]{ display:none; }
.frame[data-d="desktop"] .info.strip{ grid-area:auto; width:auto; flex-direction:row; flex-wrap:wrap; justify-content:center; padding:12px 24px 0; gap:8px; }
.top .hinfo{ display:inline-flex; align-items:center; gap:10px; font-size:13px; color:var(--fg2); padding-left:12px; border-left:1px solid var(--line2); }
.top .hinfo b{ color:var(--acc); font-weight:700; }
.top .hinfo .bad{ color:var(--bad); font-weight:700; }
.frame[data-d="phone"] .info{ width:auto; flex-direction:row; padding:10px 16px 0; gap:6px; overflow-x:auto; flex-wrap:nowrap; }
.frame[data-d="land"] .info{ width:150px; padding:10px 0 10px 12px; gap:5px; }
.chip{ padding:6px 12px; border-radius:999px; background:var(--chip); color:var(--chip-fg); font-size:13px; font-weight:500; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.25); }
.chip.strong{ background:var(--chip-strong); color:var(--chip-strong-fg); font-weight:700; }
.chip.bad{ background:var(--chip-bad); color:var(--chip-bad-fg); font-weight:700; }
.frame[data-d="phone"] .chip, .frame[data-d="land"] .chip{ font-size:12px; padding:4px 10px; }

/* the felt in the middle */
.centre{ grid-area:centre; display:flex; flex-direction:column; min-width:0; min-height:0; position:relative; }
.below{ display:flex; align-items:flex-end; justify-content:center; padding:0 24px; gap:16px; }
.frame[data-d="phone"] .below, .frame[data-d="land"] .below{ padding:0; }
.below .chatdock{ width:400px; max-height:190px; display:flex; flex-direction:column; margin-top:12px; }
.below .chatdock+.turn{ margin-left:auto; }
.below .chatdock ul{ overflow-y:auto; flex:1; }
.chatdock.panel{ background:var(--panel-float); }
.frame[data-d="phone"] .centre, .frame[data-d="phone"] .info, .frame[data-d="phone"] .side{ flex:none; }
.felt{ flex:1; display:flex; align-items:center; justify-content:center; padding:12px 24px 0; min-height:0; }
.frame[data-d="phone"] .felt{ padding:12px 12px 0; }
.frame[data-d="land"] .felt{ padding:2px 12px 0; }
.ring{ display:grid; grid-template-columns:auto auto auto; grid-template-rows:auto auto; grid-template-areas:'w n e' 'w t e'; align-items:center; justify-items:center; column-gap:28px; row-gap:8px; }
.miza.free .ring{ column-gap:120px; row-gap:24px; }
.frame[data-d="phone"] .ring{ grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); column-gap:6px; width:100%; }
.frame[data-d="phone"] .seat{ width:100%; }
.frame[data-d="phone"] .seat .m{ flex-direction:column; gap:2px; }
.frame[data-d="phone"] .seat.north{ width:auto; }
.frame[data-d="phone"] .seat.north .m{ flex-direction:row; gap:8px; }
.frame[data-d="land"] .ring{ grid-template-columns:auto auto auto; grid-template-rows:auto auto; grid-template-areas:'n n n' 'w t e'; column-gap:14px; row-gap:4px; }
.frame[data-d="land"] .miza.free .ring{ column-gap:80px; }
.seat{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 14px; border-radius:14px; border:2px solid transparent; background:var(--seat); min-width:150px; color:var(--felt-fg); }
.frame[data-d="phone"] .seat, .frame[data-d="land"] .seat{ min-width:0; padding:6px 10px; gap:3px; }
.seat.on{ border-color:var(--acc); background:var(--seat-on); }
.seat .n{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
.frame[data-d="phone"] .seat .n, .frame[data-d="land"] .seat .n{ font-size:13px; }
.seat .badge{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; padding:2px 7px; border-radius:6px; background:var(--acc); color:var(--acc-fg); }
.seat .m{ display:flex; align-items:center; gap:10px; font-size:12px; color:var(--felt-fg2); }
.backs{ display:inline-flex; }
.backs span{ width:16px; height:26px; border-radius:4px; background:var(--back); border:1px solid var(--back-edge); display:inline-block; }
.backs span+span{ margin-left:-9px; }
.frame[data-d="phone"] .backs span, .frame[data-d="land"] .backs span{ width:11px; height:18px; }
.frame[data-d="phone"] .backs span+span, .frame[data-d="land"] .backs span+span{ margin-left:-7px; }
.frame[data-d="phone"] .top .rt, .frame[data-d="land"] .top .rt, .frame[data-d="phone"] .top .me b{ display:none; }
.seat .m svg{ width:14px; height:14px; }
.trick{ grid-area:t; position:relative; width:300px; height:236px; }
.miza.free .trick{ width:360px; height:270px; }
.frame[data-d="phone"] .trick{ width:200px; height:210px; }
.frame[data-d="land"] .trick{ width:220px; height:136px; }
.frame[data-d="land"] .seat.north{ grid-area:n !important; }
.trick .slot{ position:absolute; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12px; color:var(--felt-fg2); }
.trick .slot.n{ top:0; left:50%; transform:translateX(-50%); }
.trick .slot.w{ left:0; top:50%; transform:translateY(-50%); }
.trick .slot.e{ right:0; top:50%; transform:translateY(-50%); }
.trick .slot.s{ bottom:0; left:50%; transform:translateX(-50%); }
.trick .empty{ width:64px; height:94px; border-radius:10px; border:2px dashed var(--acc); opacity:.75; }
.frame[data-d="phone"] .trick .empty{ width:52px; height:76px; }
.frame[data-d="land"] .trick .empty{ width:40px; height:58px; }
.frame[data-d="land"] .trick .slot.n{ top:0; }
.frame[data-d="land"] .trick .slot > span{ display:none; }
.trick .note{ position:absolute; bottom:-22px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:12px; color:var(--felt-fg2); }
.frame[data-d="land"] .trick .note{ display:none; }

.turn{ align-self:flex-end; display:inline-flex; align-items:center; gap:14px; padding:10px 18px; border-radius:999px; background:var(--bg2); border:1px solid var(--line2); box-shadow:0 10px 30px rgba(0,0,0,.35); margin:18px 0 0; max-width:calc(100% - 32px); }
.frame[data-d="phone"] .turn{ gap:8px; padding:8px 12px; font-size:12px; margin-top:26px; }
.frame[data-d="land"] .turn{ gap:8px; padding:3px 12px; font-size:12px; margin-top:2px; }
.turn .dot{ width:10px; height:10px; border-radius:50%; background:var(--acc); box-shadow:0 0 12px var(--acc); flex-shrink:0; }
.turn b{ font-family:var(--display); font-weight:700; font-size:15px; color:var(--fg); white-space:nowrap; }
.frame[data-d="land"] .turn b{ font-size:13px; }
.turn span{ color:var(--fg2); font-size:13px; }
.frame[data-d="phone"] .turn span, .frame[data-d="land"] .turn span{ display:none; }
.turn .clk{ display:inline-flex; align-items:center; gap:5px; font-weight:700; color:var(--acc); font-variant-numeric:tabular-nums; white-space:nowrap; }
.turn .clk svg{ width:16px; height:16px; }
.hand{ display:flex; align-items:flex-end; justify-content:center; padding:14px 16px 12px; gap:0; }
.frame[data-d="land"] .hand{ padding:4px 8px 6px; }
.frame[data-d="land"] .hand[data-h="rows"]{ display:grid; grid-template-columns:repeat(6, auto); gap:4px 6px; justify-content:center; padding:4px 8px 6px; }
.frame[data-d="land"] .hand[data-h="rows"] .card+.card{ margin-left:0; }
.frame[data-d="land"] .hand[data-h="rows"] .card{ --cw:44px; --ch:32px; }
.frame[data-d="land"] .hand[data-h="rows"] .card .glyph, .frame[data-d="land"] .hand[data-h="rows"] .card.tr .corner{ display:none; }
.frame[data-d="land"] .hand[data-h="rows"] .card .corner, .frame[data-d="land"] .hand[data-h="rows"] .card .num{ position:static; transform:none; font-size:13px; opacity:1; }
.frame[data-d="land"] .hand[data-h="rows"] .card.suit .corner::after{ content:attr(data-g); margin-left:2px; }
.frame[data-d="land"] .hand[data-h="stack"]{ padding-top:12px; }
.frame[data-d="land"] .hand[data-h="stack"] .card+.card{ margin-left:-38px; }
.frame[data-d="land"] .hand[data-h="stack"] .card.legal{ transform:translateY(-10px); }
.frame[data-d="land"] .hand[data-h="stack"] .card.legal:hover{ transform:translateY(-18px); }

/* side column */
.side{ grid-area:side; width:320px; display:flex; flex-direction:column; gap:12px; padding:16px 24px 16px 0; min-height:0; }
.frame[data-d="desktop"] .side .chat{ margin-top:auto; margin-bottom:136px; } /* bottom edge level with the top of the hand */
.side:empty{ display:none; }
.frame[data-d="phone"] .side{ width:auto; padding:12px 16px 24px; }
.frame[data-d="land"] .side{ width:250px; padding:8px 12px 8px 0; gap:8px; overflow-y:auto; }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px 16px; backdrop-filter:blur(6px); }
.frame[data-d="land"] .panel{ padding:8px 10px; border-radius:12px; }
.panel h2{ margin:0 0 8px; font-family:var(--display); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--acc); display:flex; align-items:center; gap:8px; }
.panel h2 .sp{ flex:1; }
.panel h2 button{ border:0; background:transparent; color:var(--fg2); cursor:pointer; padding:2px; display:grid; place-items:center; }
.panel h2 button svg{ width:14px; height:14px; }
.tbl{ width:100%; border-collapse:collapse; font-size:13px; color:var(--fg); }
.frame[data-d="land"] .tbl{ font-size:11px; }
.tbl th{ text-align:right; padding:5px 6px; font-weight:600; color:var(--fg2); }
.tbl th:first-child,.tbl td:first-child,.tbl th:nth-child(2),.tbl td:nth-child(2){ text-align:left; color:var(--fg2); }
.tbl th.you{ color:var(--acc); }
.tbl td{ text-align:right; padding:5px 6px; font-variant-numeric:tabular-nums; }
.frame[data-d="land"] .tbl td, .frame[data-d="land"] .tbl th{ padding:2px 4px; }
.tbl td.p{ color:var(--good); } .tbl td.m{ color:var(--bad); }
.tbl tfoot tr{ border-top:1px solid var(--line2); }
.tbl tfoot td{ font-weight:700; }
.tbl tfoot tr.r td{ font-weight:500; color:var(--bad); letter-spacing:.1em; }
.chat.boxed{ transition:box-shadow .2s, border-color .2s, transform .2s; }
.chat.boxed:hover, .chat.boxed:focus-within{ border-color:var(--acc); box-shadow:0 10px 30px rgba(0,0,0,.25); transform:translateY(-2px); }
.chat.glass{ background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.42)); border-color:transparent; backdrop-filter:none; color:var(--felt-fg); transition:background .2s; }
.chat.glass:hover, .chat.glass:focus-within{ background:var(--panel-float); border-color:var(--line); }
.chat.glass li{ text-shadow:0 1px 2px rgba(0,0,0,.55); }
.chat.glass li i{ color:var(--felt-fg2); }
.chat.glass input{ background:rgba(0,0,0,.28); border-color:rgba(255,255,255,.18); color:var(--felt-fg); }
.chat.glass input::placeholder{ color:var(--felt-fg2); }
.chat ul{ list-style:none; margin:0 0 10px; padding:0; display:flex; flex-direction:column; gap:6px; font-size:13px; }
.frame[data-d="land"] .chat ul{ font-size:11px; gap:3px; margin-bottom:6px; }
.chat li i{ color:var(--fg2); }
.chat li b{ color:var(--acc); font-weight:600; }
.chat form{ display:flex; gap:8px; }
.chat input{ flex:1; min-width:0; padding:8px 12px; border-radius:10px; border:1px solid var(--line2); background:var(--bg3); color:var(--fg); font:inherit; }
.chat button{ padding:8px 14px; border-radius:10px; border:0; background:var(--acc); color:var(--acc-fg); font:inherit; font-weight:700; cursor:pointer; }
.frame[data-d="land"] .chat input, .frame[data-d="land"] .chat button{ padding:5px 9px; font-size:12px; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* ---------- cards ---------- */
.card{ --cw:84px; --ch:124px; position:relative; flex-shrink:0; width:var(--cw); height:var(--ch); border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0; font:inherit; cursor:default; box-shadow:0 6px 16px rgba(0,0,0,.45); border:1px solid rgba(0,0,0,.4); overflow:hidden; color:#2b2420; background:#f6efdc; }
.card.sm{ --cw:64px; --ch:94px; }
.card.lg{ --cw:110px; --ch:162px; }
.frame[data-d="phone"] .hand{ display:grid; grid-template-columns:repeat(6,auto); gap:6px; justify-content:center; padding:10px 8px 12px; }
.frame[data-d="phone"] .hand .card{ --cw:56px; --ch:82px; }
.frame[data-d="phone"] .hand .card.legal{ box-shadow:0 6px 16px rgba(0,0,0,.45), 0 0 0 3px var(--acc); }
.frame[data-d="phone"] .hand .card.legal:hover, .frame[data-d="phone"] .hand .card.legal:focus-visible{ transform:translateY(-6px); }
.frame[data-d="land"] .hand .card{ --cw:56px; --ch:82px; }
.frame[data-d="phone"] .trick .card{ --cw:52px; --ch:76px; }
.frame[data-d="land"] .trick .card{ --cw:40px; --ch:58px; }
.hand .card+.card{ margin-left:-22px; }
.frame[data-d="phone"] .hand .card+.card{ margin-left:0; }
.frame[data-d="land"] .hand .card+.card{ margin-left:-30px; }
.card.legal{ cursor:pointer; }
.card.legal:hover,.card.legal:focus-visible{ transform:translateY(-14px); box-shadow:0 14px 26px rgba(0,0,0,.5), 0 0 0 3px var(--acc); z-index:2; outline:none; }
.card.dim{ opacity:.9; filter:brightness(.55) saturate(.45); }
/* plain suits: cream card, rank in the corner, one big pip */
.card{ background:#f4f1ea; color:#15181c; border-radius:10px; }
.card.suit.red{ color:#c8362b; }
.card .corner{ position:absolute; top:6px; left:8px; font-size:13px; font-weight:700; opacity:.8; }
.card.suit .glyph{ font-size:40px; line-height:1; }
.card.sm .glyph{ font-size:26px; }
.frame[data-d="phone"] .hand .card .glyph{ font-size:26px; }
.frame[data-d="land"] .hand .card .glyph{ font-size:24px; }
.frame[data-d="land"] .trick .card .glyph{ font-size:18px; }
/* trumps: dark card, gold numeral, small T in the corner */
.card.tr{ background:linear-gradient(160deg,#2b2f36,#15181c); color:#e9c46a; border-color:rgba(0,0,0,.6); }
.card.tr .num{ font-family:var(--display); font-weight:700; font-size:calc(var(--ch) * .21); line-height:1; letter-spacing:.01em; }
.frame[data-d="desktop"] .hand .card.tr:not(:last-child) .num{ margin-right:22px; } /* centred in the strip the next card leaves visible */
.frame[data-d="land"] .hand:not([data-h="rows"]) .card.tr .num{ display:none; }
.frame[data-d="land"] .hand:not([data-h="rows"]) .card.tr .corner{ font-size:0; }
.frame[data-d="land"] .hand:not([data-h="rows"]) .card.tr .corner::after{ content:attr(data-r); font-size:11px; opacity:1; }
.turn{ white-space:nowrap; }
.frame[data-d="desktop"] .miza[data-l="float"] .felt{ align-items:flex-end; padding-bottom:4px; }
.frame[data-d="desktop"] .miza[data-l="float"] .ring{ column-gap:110px; row-gap:16px; }

</style>

<div class="chrome">
	<div>
		<h1>TaroKing Mockups</h1>
		<p class="lead">Smer 2 · Nočna miza. Potrjena različica: tri barvne sheme, info kot vrstica nad mizo, zapisnik in klepet desno (klepet prosojen v temni in modri, v okvirju v svetli), vklopljive plošče. Telefon je privzeto ležeč s pahljačo; pokončni ima roko v dveh vrstah.</p>
	</div>
	<div class="controls">
		<div class="ctl"><label>Shema</label><div class="seg" data-k="s"><button aria-pressed="true" data-v="dark">Temna</button><button data-v="light">Svetla</button><button data-v="blue">Modra</button></div></div>
		<div class="ctl"><label>Plošče</label><div class="seg" data-k="panels"><button aria-pressed="true" data-v="info">Info</button><button aria-pressed="true" data-v="sheet">Zapisnik</button><button aria-pressed="true" data-v="chat">Klepet</button></div></div>
		<div class="ctl"><label>Naprava</label><div class="seg" data-k="d"><button aria-pressed="true" data-v="desktop">Desktop 1280</button><button data-v="land">Telefon ležeče (privzeto)</button><button data-v="phone">Telefon pokončno (test)</button></div></div>
		<div class="ctl land-only"><label>Karte v roki (ležeče)</label><div class="seg" data-k="h"><button aria-pressed="true" data-v="fan">Pahljača</button><button data-v="stack">Kup</button><button data-v="rows">Dve vrsti</button></div></div>
	</div>
	<div class="notes" id="notes"></div>
	<div class="stage"><div class="scaler" id="scaler">
		<div class="frame" id="frame" data-s="dark" data-d="desktop">
			<div class="app" id="app"></div>
		</div>
	</div></div>
</div>

<script>
const ICON = {
	user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
	clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
	x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* The one shared moment: hand 3 of 12, Ana plays solo dva, hearts called, hearts led — you must follow suit. */
const HAND = [
	['T','XXI'],['T','XIX'],['T','XIV'],['T','IX'],['T','V'],['T','II'],
	['H','K'],['H','D'],['H','4'],['S','10'],['C','J'],['D','K']
];
const LEGAL = new Set(['K♥','D♥','4♥']);
const TRICK = [['w','Boris',['H','9']],['n','Ana',['H','K']],['e','Cilka',['H','7']]];
const SEATS = { w:['Boris',8,'','0:41'], n:['Ana',8,'igralec','1:02'], e:['Cilka',8,'','0:58'] };
const GLYPH = { H:'♥', D:'♦', S:'♠', C:'♣' };
const SUIT_NAME = { H:'srce', D:'karo', S:'pik', C:'križ', T:'tarok' };

function card(c, { legal=true, dim=false, size='', button=true }={}){
	const [suit, rank] = c;
	const name = suit==='T' ? `${rank==='ŠKIS'?'Škis':rank} · tarok` : `${rank}${GLYPH[suit]} · ${SUIT_NAME[suit]}`;
	const cls = ['card', size, legal&&!dim?'legal':'', dim?'dim':'', suit==='T'?'tr':'suit'+(suit==='H'||suit==='D'?' red':'')].filter(Boolean).join(' ');
	const tag = button && legal && !dim ? 'button' : 'div';
	const attrs = `class="${cls}" title="${name}" ${tag==='button'?`type="button" aria-label="${name}"`:''}`;
	if(suit!=='T') return `<${tag} ${attrs}><span class="corner" data-g="${GLYPH[suit]}">${rank}</span><span class="glyph">${GLYPH[suit]}</span></${tag}>`;
	return `<${tag} ${attrs}><span class="corner" data-r="${rank}">T</span><span class="num">${rank}</span></${tag}>`;
}

function seat(key){
	const [n, cards, badge, clock] = SEATS[key];
	return `<div class="seat ${key==='n'?'on north':''}" style="grid-area:${key}">
		<div class="n">${n}${badge?`<span class="badge">${badge}</span>`:''}</div>
		<div class="m"><span class="backs">${'<span></span>'.repeat(cards)}</span><span style="display:inline-flex;align-items:center;gap:4px">${ICON.clock} ${clock}</span></div>
	</div>`;
}

function trick(){
	return `<div class="trick">
		${TRICK.map(([pos,who,c])=>`<div class="slot ${pos}">${card(c,{legal:false,size:'sm',button:false})}<span>${who}</span></div>`).join('')}
		<div class="slot s"><div class="empty"></div></div>
		<span class="note">3. štih · vodi srce</span>
	</div>`;
}

function sheet(){
	const rows = [[1,'tri',[-15,15,15,-15]],[2,'klop',[-35,70,-20,-15]]];
	const tot = [-50,85,-5,-30];
	const cell = v => `<td class="${v>0?'p':v<0?'m':''}">${v>0?'+'+v:v}</td>`;
	return `<section class="panel"><h2>Zapisnik<span class="sp"></span><button type="button" aria-label="Skrij zapisnik" data-hide="sheet">${ICON.x}</button></h2>
	<table class="tbl"><thead><tr><th>#</th><th>igra</th><th class="you">Ti</th><th>Ana</th><th>Boris</th><th>Cilka</th></tr></thead>
	<tbody>${rows.map(([n,g,s])=>`<tr><td>${n}</td><td>${g}</td>${s.map(cell).join('')}</tr>`).join('')}</tbody>
	<tfoot><tr><td colspan="2">skupaj</td>${tot.map(cell).join('')}</tr><tr class="r"><td colspan="2">radlci</td><td>◯</td><td>◯</td><td>◯</td><td>◯</td></tr></tfoot></table></section>`;
}

function chat(extra=''){
	return `<section class="panel chat ${extra} ${state.s==='light'?'boxed':'glass'}"><h2>Za mizo<span class="sp"></span><button type="button" aria-label="Skrij klepet" data-hide="chat">${ICON.x}</button></h2>
	<ul><li><i>Ana igra solo dva, klican srce.</i></li><li><b>Boris</b> kontra!</li><li><i>Boris je dal kontro na igro.</i></li><li><b>Cilka</b> Ana, to bo boleče :)</li></ul>
	<form onsubmit="return false"><label class="sr" for="msg">Sporočilo</label><input id="msg" placeholder="Napiši kaj…"><button type="submit">Pošlji</button></form></section>`;
}

function info(){
	if(!state.panels.info) return '';
	const strip = state.d==='desktop' && state.i==='strip';
	if(state.d==='desktop' && state.i==='head') return '';
	return `<div class="info ${strip?'strip':'chips'}">
		<span class="chip">Partija 3 / 12</span><span class="chip strong">Solo dva</span><span class="chip">Igralec: Ana</span>
		<span class="chip">Klican: srce ♥</span><span class="chip bad">Kontra ×2</span><span class="chip">Faza: igra</span>
	</div>`;
}
function headInfo(){
	if(!(state.d==='desktop' && state.i==='head' && state.panels.info)) return '';
	return `<span class="hinfo"><span>3 / 12</span><b>Solo dva</b><span>igra Ana</span><span>klican ♥</span><span class="bad">kontra ×2</span></span>`;
}

function topbar(){
	return `<header class="top"><a class="brand" href="#">TaroKing</a>
		<nav><a>Domov</a><a>Proti botom</a><a class="on">Spletne mize</a><a>Lestvica</a></nav>${headInfo()}<span class="sp"></span>
		<span class="pbtn">${[['info','Info'],['sheet','Zapisnik'],['chat','Klepet']].map(([k,l])=>`<button type="button" aria-pressed="${state.panels[k]}" data-toggle="${k}">${l}</button>`).join('')}</span>
		<span class="me">${ICON.user}<b>Damir</b><span class="rt"> · 1042</span></span></header>`;
}

function renderMiza(){
	const desk = state.d==='desktop';
	const chatLow = desk && state.l!=='cols' && state.panels.chat;
	const side = [ state.panels.sheet ? sheet() : '', !chatLow && state.panels.chat ? chat() : '' ].join('');
	const free = !state.panels.info && !state.panels.sheet && !state.panels.chat;
	const strip = desk && state.i!=='chips';
	return `${topbar()}<div class="miza ${free?'free':''}" data-l="${desk?state.l:'cols'}">
		${strip?'':info()}
		<div class="centre">
			${strip?info():''}
			<div class="felt"><div class="ring">${seat('n')}${seat('w')}${seat('e')}${trick()}</div></div>
			<div class="below">${chatLow?chat('chatdock'):''}<div class="turn"><span class="dot"></span><b>Na potezi si</b><span>srce je vodeno — priznati moraš barvo</span><span class="clk">${ICON.clock} 0:47</span></div></div>
			<div class="hand" data-h="${state.h}">${HAND.map(c=>{ const l = c[0]==='T' ? false : LEGAL.has(c[1]+GLYPH[c[0]]); return card(c,{legal:l, dim:!l}); }).join('')}</div>
		</div>
		<aside class="side">${side}</aside>
	</div>`;
}

const NOTES = {
	dark:[['Temna','Skoraj črna podlaga, zeleni odsev na sredini, zlat poudarek. Plošče so prosojne, da se čuti miza pod njimi.'],['Tipografija','Sora za naslove, Fraunces za številke na kartah, IBM Plex Sans za vse ostalo.']],
	light:[['Svetla','Umirjena: topla siva podlaga (#d9d4c7) namesto bele, plošče le malo svetlejše, sredina ostane temno zeleno platno.'],['Poudarek','Temnejše zlato (#9a6a15), da na sivi doseže kontrast.']],
	blue:[['Modra','Petrolejska podlaga in svetlejši modri odsev na sredini, koralen poudarek in rumeni čipi — vzeto iz smeri 4.'],['Kaj se ne spremeni','Postavitev, plošče in karte so iste; menja se samo barva.']]
};
const CARD_NOTE = ['Karte','Barvne karte so kremne z oznako v kotu in enim velikim znakom; taroki so temni z zlato rimsko številko in malim T v kotu. Nedovoljene karte so potemnjene in razbarvane (ne več prosojne), zato roka ne izgleda kot siv blok na mizi.'];
const DESK_NOTE = ['Namizje','Izbrano: info kot vrstica čipov nad mizo, zapisnik zgoraj desno, klepet spodaj desno nad kartami. Klepet je v temni in modri shemi prosojen (okvir se pokaže ob miški), v svetli je v okvirju, ki se ob miški dvigne.'];
const PANEL_NOTE = ['Plošče','Info levo, zapisnik in klepet desno. Vsaka se skrije z gumbom v svoji glavi ali s stikalom; na telefonu so stikala v vrhnji vrstici. Ko so skrite vse tri, se igralci razmaknejo in štih zraste.'];
const DEVICE_NOTE = {
	desktop:['Desktop','Sredina je vedno na sredini prostora, ki ostane med ploščami.'],
	land:['Telefon ležeče','Privzeta postavitev na telefonu. Sever sedi v svoji vrsti nad Borisom in Cilko, plošče so ožje in se pomikajo. Roka je pahljača (izbrano); kup in dve vrsti ostajata tu samo za primerjavo.'],
	phone:['Telefon pokončno','Testna postavitev. Čipi v vrsti, igralci ožje, plošče pod roko. Roka je mreža 2 × 6 manjših kart; dovoljene imajo zlat rob, ostale so zatemnjene.']
};

const frame=document.getElementById('frame'), app=document.getElementById('app'), scaler=document.getElementById('scaler'), stage=document.querySelector('.stage');
const state={ s:'dark', d:'desktop', h:'fan', l:'cols', i:'strip', panels:{ info:true, sheet:true, chat:true } };

function render(){
	app.innerHTML = renderMiza();
	app.querySelectorAll('[data-hide]').forEach(b=>b.addEventListener('click',()=>togglePanel(b.dataset.hide)));
	app.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>togglePanel(b.dataset.toggle)));
}
function togglePanel(name){
	state.panels[name]=!state.panels[name];
	document.querySelectorAll('.seg[data-k="panels"] button').forEach(b=>b.setAttribute('aria-pressed',state.panels[b.dataset.v]));
	render(); fit(); save();
}
function set(k,v){
	state[k]=v;
	document.querySelectorAll(`.seg[data-k="${k}"] button`).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
	frame.dataset.s=state.s; frame.dataset.d=state.d;
	document.querySelector('.ctl.land-only').classList.toggle('show', state.d==='land');
	document.querySelectorAll('.ctl.desk-only').forEach(c=>c.classList.toggle('show', state.d==='desktop'));
	const n=[...NOTES[state.s], DEVICE_NOTE[state.d], ...(state.d==='desktop'?[DESK_NOTE]:[]), PANEL_NOTE, CARD_NOTE];
	document.getElementById('notes').innerHTML=n.map(([b,t])=>`<div><b>${b}</b> · <span>${t}</span></div>`).join('');
	render(); fit(); save();
}
function fit(){
	const w=frame.offsetWidth, avail=stage.clientWidth, sc=Math.min(1,avail/w);
	scaler.style.transform=`scale(${sc})`; scaler.style.height=(frame.offsetHeight*sc)+'px'; scaler.style.width=w+'px';
}
function save(){ try{ localStorage.setItem('tk-mock-7',JSON.stringify(state)); }catch(e){} }
document.querySelectorAll('.seg[data-k]:not([data-k="panels"]) button').forEach(b=>b.addEventListener('click',()=>set(b.closest('.seg').dataset.k,b.dataset.v)));
document.querySelectorAll('.seg[data-k="panels"] button').forEach(b=>b.addEventListener('click',()=>togglePanel(b.dataset.v)));
window.addEventListener('resize',fit);
try{ const s=JSON.parse(localStorage.getItem('tk-mock-7')||'{}'); Object.assign(state,s); if(s.panels) state.panels=Object.assign({info:true,sheet:true,chat:true},s.panels); }catch(e){}
document.querySelectorAll('.seg[data-k="panels"] button').forEach(b=>b.setAttribute('aria-pressed',state.panels[b.dataset.v]));
['s','d','h'].forEach(k=>set(k,state[k]));
</script>
